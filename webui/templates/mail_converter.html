<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮箱池地址转换</title>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --text:#172033; --muted:#667085; --line:#d9e2ec; --blue:#2563eb; --green:#16803c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:32px auto 48px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
    h1 { margin:0; font-size:24px; }
    .sub { margin:6px 0 0; color:var(--muted); }
    .back { color:var(--blue); text-decoration:none; white-space:nowrap; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px #0f172a0d; padding:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .label { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:600; }
    .hint { color:var(--muted); font-size:12px; font-weight:400; }
    textarea { width:100%; min-height:420px; resize:vertical; padding:12px; border:1px solid var(--line); border-radius:8px; outline:none; font:13px/1.55 Consolas,"Microsoft YaHei Mono",monospace; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #2563eb18; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px; }
    button, .file { border:0; border-radius:7px; padding:9px 14px; cursor:pointer; font:inherit; }
    button.primary { background:var(--blue); color:#fff; } button.secondary,.file { background:#eef2f7; color:var(--text); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input[type=file] { display:none; }
    .stats { display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; color:var(--muted); font-size:12px; }
    .pill { padding:4px 9px; border-radius:999px; background:#f0f2f5; } .pill.ok { color:var(--green); background:#e9f7ee; }
    .note { margin-top:16px; padding:11px 12px; border-radius:8px; background:#fff8e8; color:#8a5a00; font-size:12px; }
    @media (max-width:800px) { .grid { grid-template-columns:1fr; } textarea { min-height:280px; } .stats { margin-left:0; width:100%; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>邮箱池地址转换</h1><p class="sub">把 zhangbinbin 网页取件地址批量转换为 latest JSON API 地址</p></div>
      <a class="back" href="/">返回控制台</a>
    </header>
    <section class="card">
      <div class="grid">
        <div>
          <div class="label"><span>原始邮箱池</span><span class="hint">每行：邮箱----取件地址</span></div>
          <textarea id="source" spellcheck="false" placeholder="粘贴邮箱池文本，或点击下方导入文件"></textarea>
        </div>
        <div>
          <div class="label"><span>转换结果</span><span class="hint">仅替换 URL，其他内容保持不变</span></div>
          <textarea id="result" spellcheck="false" readonly placeholder="点击“转换”生成结果"></textarea>
        </div>
      </div>
      <div class="toolbar">
        <label class="file">导入文件<input id="file" type="file" accept=".txt,.text,.csv"></label>
        <button class="primary" id="convert">转换</button>
        <button class="secondary" id="copy" disabled>复制结果</button>
        <button class="secondary" id="download" disabled>下载 API 文件</button>
        <div class="stats" id="stats"><span class="pill">等待输入</span></div>
      </div>
      <div class="note">本页面只在本机做文本转换，不会请求邮箱接口；原文件不会被覆盖。项目注册页本身也会自动完成同样的转换。</div>
    </section>
  </main>
  <script>
    const source = document.getElementById('source'), result = document.getElementById('result');
    const convertBtn = document.getElementById('convert'), copyBtn = document.getElementById('copy'), downloadBtn = document.getElementById('download');
    const stats = document.getElementById('stats');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setStats(c) { stats.innerHTML = `<span class="pill ok">已转换 ${c.converted}</span><span class="pill">跳过 ${c.skipped}</span><span class="pill">格式异常 ${c.invalid}</span>`; }
    async function convert() {
      if (!source.value.trim()) { result.value = ''; stats.innerHTML = '<span class="pill">先粘贴邮箱池内容</span>'; return; }
      convertBtn.disabled = true;
      try {
        const r = await fetch('/api/mail-converter', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:source.value})});
        const data = await r.json(); if (!r.ok || !data.ok) throw new Error(data.error || '转换失败');
        result.value = data.text; setStats(data.counts); copyBtn.disabled = false; downloadBtn.disabled = false;
      } catch (e) { stats.innerHTML = `<span class="pill">${esc(e.message)}</span>`; }
      finally { convertBtn.disabled = false; }
    }
    document.getElementById('file').addEventListener('change', async (e) => { const f=e.target.files[0]; if(f){ source.value=await f.text(); await convert(); } e.target.value=''; });
    convertBtn.addEventListener('click', convert);
    copyBtn.addEventListener('click', async () => { await navigator.clipboard.writeText(result.value); copyBtn.textContent='已复制'; setTimeout(()=>copyBtn.textContent='复制结果',1200); });
    downloadBtn.addEventListener('click', () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([result.value],{type:'text/plain;charset=utf-8'})); a.download='邮箱池.api.txt'; a.click(); URL.revokeObjectURL(a.href); });
  </script>
</body>
</html>
